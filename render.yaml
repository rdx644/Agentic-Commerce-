services:
  - type: web
    name: agentic-commerce
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-commerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPERATOR_USERNAME
        value: operator
      - key: OPERATOR_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: agentic-commerce-db
    plan: free
    databaseName: agentic_commerce
    user: rdx644
    region: oregon
