name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Execute Ruff Lint Checks
        run: |
          ruff check src tests --select E9,F63,F7,F82

      - name: Verify Zero Dangerous Frontend Sinks
        run: |
          python -c "
          app_js = open('dashboard/app.js', encoding='utf-8').read()
          arch_html = open('architecture_graph.html', encoding='utf-8').read()
          gen_py = open('scripts/generate_graph_html.py', encoding='utf-8').read()
          sinks = ['innerHTML', 'outerHTML', 'insertAdjacentHTML', 'document.write', 'eval(']
          for f_name, content in [('dashboard/app.js', app_js), ('architecture_graph.html', arch_html), ('scripts/generate_graph_html.py', gen_py)]:
              for s in sinks:
                  if s in content:
                      raise SystemExit(f'Dangerous sink {s} found in {f_name}')
          print('Frontend sinks check: PASSED (Zero dangerous sinks)')
          "

  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentic_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d agentic_commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/agentic_commerce_test
          APP_ENV: test
          JWT_SECRET: super-secret-key-for-testing-at-least-32-chars-long
          OPERATOR_USERNAME: admin
          OPERATOR_PASSWORD: test-operator-password-123
          RAZORPAY_KEY_ID: rzp_test_dummy123456789
          RAZORPAY_KEY_SECRET: dummy_razorpay_secret_123456
          RAZORPAY_WEBHOOK_SECRET: dummy_webhook_secret_123456
          GEMINI_API_KEY: dummy_gemini_api_key_123456
          LOG_LEVEL: INFO
          ALLOWED_HOSTS: "*"
        run: |
          pytest tests/ -v

  dashboard:
    name: Validate Dashboard Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JavaScript Syntax
        working-directory: dashboard
        run: node --check app.js

  build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: [test, dashboard]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agentic-commerce:latest
