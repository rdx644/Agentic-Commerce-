        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("svg")
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }));
            
        const g = svg.append("g");

        const color = d3.scaleOrdinal()
            .domain([1, 2, 3])
            .range(["#4d7cff", "#34d399", "#f87171"]);

        const simulation = d3.forceSimulation(graph.nodes)
            .force("link", d3.forceLink(graph.links).id(d => d.id).distance(50))
            .force("charge", d3.forceManyBody().strength(-150))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(20));

        const link = g.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(graph.links)
            .join("line")
            .attr("class", "link")
            .attr("stroke-width", d => d.type === 'IMPORTS' ? 2 : 1)
            .style("stroke-dasharray", d => d.type === 'IMPORTS' ? "none" : "3,3");

        const node = g.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(graph.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.group === 1 ? 8 : (d.group === 2 ? 6 : 4))
            .attr("fill", d => color(d.group));

        node.append("text")
            .attr("class", "label")
            .attr("dx", 12)
            .attr("dy", 4)
            .text(d => d.name)
            .style("display", d => d.group === 1 ? "block" : "none");

        // Show/hide labels on hover and update info panel
        node.on("mouseover", function(event, d) {
            d3.select(this).select("text").style("display", "block");
            
            // Find connected links
            const connectedLinks = graph.links.filter(l => l.source.id === d.id || l.target.id === d.id);
            const importedBy = connectedLinks.filter(l => l.target.id === d.id && l.type === 'IMPORTS').map(l => l.source.name);
            const imports = connectedLinks.filter(l => l.source.id === d.id && l.type === 'IMPORTS').map(l => l.target.name);
            
            let html = `<strong>${d.name}</strong><br/><span style="color:#8888a0;font-size:11px">${d.type.toUpperCase()}</span><br/><br/>`;
            html += `<div style="font-size:11px;word-wrap:break-word;">${d.id}</div>`;
            
            if (imports.length > 0) html += `<br/><strong>Imports:</strong> ${imports.join(', ')}`;
            if (importedBy.length > 0) html += `<br/><strong>Imported by:</strong> ${importedBy.join(', ')}`;
            
            document.getElementById("selected-node").innerHTML = html;
        })
        .on("mouseout", function(event, d) {
            if (d.group !== 1) {
                d3.select(this).select("text").style("display", "none");
            }
            document.getElementById("selected-node").innerHTML = "Hover over a node to see details.";
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
